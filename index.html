<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Snake-Man 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
:root {
  --cyan: #00f3ff;
  --gold: #ffb800;
  --red: #ff3366;
  --green: #00ff66;
  --bg: #090b14;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  font-family: 'Rajdhani', sans-serif;
  color: #fff;
}

#app {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100%;
  position: relative;
}

/* HUD Superior */
#hud {
  flex-shrink: 0;
  padding: 8px 12px 6px 12px;
  background: rgba(14, 18, 36, 0.95);
  border-bottom: 2px solid rgba(0, 243, 255, 0.3);
  display: flex;
  flex-direction: column;
  gap: 6px;
  z-index: 10;
}

.hud-row-main {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.hud-box {
  display: flex;
  flex-direction: column;
}

.hud-title {
  font-family: 'Press Start 2P', monospace;
  font-size: 8px;
  color: rgba(255, 255, 255, 0.6);
}

.hud-data {
  font-size: 16px;
  font-weight: 800;
}

.lives-icons {
  font-size: 14px;
  letter-spacing: 2px;
}

.hud-row-status {
  display: flex;
  gap: 8px;
}

.status-pill {
  flex: 1;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 8px;
  padding: 4px 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  font-weight: 800;
}

.status-pill.active-hunter {
  border-color: var(--gold);
  background: rgba(255, 184, 0, 0.25);
  box-shadow: 0 0 10px rgba(255, 184, 0, 0.4);
}

.status-pill.active-magnet {
  border-color: var(--cyan);
  background: rgba(0, 243, 255, 0.25);
  box-shadow: 0 0 10px rgba(0, 243, 255, 0.4);
}

/* Vista 3D */
#game-canvas-wrap {
  flex: 1;
  width: 100%;
  position: relative;
  background: #06070d;
}

#banner {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.8);
  opacity: 0;
  pointer-events: none;
  background: linear-gradient(135deg, var(--cyan), #ec4899);
  padding: 12px 24px;
  border-radius: 12px;
  text-align: center;
  font-family: 'Press Start 2P', monospace;
  font-size: 14px;
  box-shadow: 0 0 25px rgba(0, 243, 255, 0.8);
  transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  z-index: 20;
}

#banner.active {
  transform: translate(-50%, -50%) scale(1);
  opacity: 1;
}

/* Controlos Táteis */
#controls {
  flex-shrink: 0;
  padding: 8px 12px calc(env(safe-area-inset-bottom, 8px) + 8px) 12px;
  background: rgba(14, 18, 36, 0.95);
  border-top: 2px solid rgba(0, 243, 255, 0.3);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 10;
}

.grid-pad {
  display: grid;
  grid-template-columns: repeat(3, 56px);
  grid-template-rows: repeat(2, 48px);
  gap: 10px;
}

.pad-btn {
  background: rgba(26, 34, 66, 0.85);
  border: 1.5px solid rgba(0, 243, 255, 0.4);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--cyan);
  font-size: 20px;
  cursor: pointer;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
  transition: transform 0.05s, background 0.05s;
}

.pad-btn:active {
  transform: scale(0.92);
  background: rgba(0, 243, 255, 0.35);
}

#b-up { grid-column: 2; grid-row: 1; }
#b-left { grid-column: 1; grid-row: 2; }
#b-down { grid-column: 2; grid-row: 2; }
#b-right { grid-column: 3; grid-row: 2; }

/* Menus */
.modal {
  position: absolute;
  inset: 0;
  z-index: 50;
  background: rgba(7, 9, 19, 0.92);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal.hidden { display: none; }

.modal-card {
  width: 90%;
  max-width: 340px;
  background: #111827;
  border: 2px solid var(--cyan);
  border-radius: 16px;
  padding: 24px 18px;
  text-align: center;
  box-shadow: 0 0 30px rgba(0, 243, 255, 0.25);
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.modal-btn {
  background: linear-gradient(135deg, var(--green), #059669);
  color: #032b17;
  font-family: 'Rajdhani', sans-serif;
  font-weight: 800;
  font-size: 18px;
  padding: 10px 24px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  letter-spacing: 1px;
}
</style>
</head>
<body>

<div id="app">
  <div id="hud">
    <div class="hud-row-main">
      <div class="hud-box">
        <span class="hud-title">VIDAS</span>
        <div class="lives-icons" id="lives-el">❤️❤️❤️❤️❤️❤️</div>
      </div>
      <div class="hud-box" style="text-align: center;">
        <span class="hud-title">FASE</span>
        <span class="hud-data" style="color: var(--gold);" id="level-el">01</span>
      </div>
      <div class="hud-box" style="text-align: right;">
        <span class="hud-title">PONTOS</span>
        <span class="hud-data" style="color: var(--cyan);"><span id="score-el">0</span>/<span id="goal-el">15</span></span>
      </div>
    </div>

    <div class="hud-row-status">
      <div class="status-pill" id="hunter-pill">
        <span>⚡ CAÇADOR</span>
        <span id="hunter-timer">OFF</span>
      </div>
      <div class="status-pill" id="magnet-pill">
        <span>🧲 ÍMÃ</span>
        <span id="magnet-timer">OFF</span>
      </div>
    </div>
  </div>

  <div id="game-canvas-wrap">
    <div id="banner">FASE COMPLETA!</div>
  </div>

  <div id="controls">
    <div class="grid-pad">
      <div class="pad-btn" id="b-up">▲</div>
      <div class="pad-btn" id="b-left">◀</div>
      <div class="pad-btn" id="b-down">▼</div>
      <div class="pad-btn" id="b-right">▶</div>
    </div>
  </div>
</div>

<div class="modal" id="start-modal">
  <div class="modal-card">
    <h2 style="font-family:'Press Start 2P',monospace; font-size:16px; color:var(--cyan);">SNAKE-MAN 3D</h2>
    <p style="font-size:13px; line-height:1.5; color:#cbd5e1;">
      • Atravesse as paredes de luz livremente!<br>
      • Apanhe o <b>⚡</b> para comer os fantasminhas.<br>
      • O <b>🧲</b> puxa as comidas até si.<br>
      • Toque nos botões ou <b>deslize o dedo no ecrã</b>.
    </p>
    <button class="modal-btn" onclick="startGame()">JOGAR</button>
  </div>
</div>

<div class="modal hidden" id="over-modal">
  <div class="modal-card">
    <h2 style="font-family:'Press Start 2P',monospace; font-size:16px; color:var(--red);">GAME OVER</h2>
    <p style="font-size:14px; color:#cbd5e1;">
      Pontuação: <b id="final-score" style="color:var(--gold); font-size:18px;">0</b><br>
      Fase: <b id="final-level" style="color:var(--cyan);">01</b>
    </p>
    <button class="modal-btn" onclick="restartGame()">TENTAR DE NOVO</button>
  </div>
</div>

<script>
// --- Áudio Web Audio API ---
const AudioFx = {
  ctx: null,
  init() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
  },
  beep(freq, type, dur, vol = 0.12) {
    if (!this.ctx) return;
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
      gain.gain.setValueAtTime(vol, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + dur);
    } catch(e) {}
  },
  eat() { this.beep(650, 'sine', 0.07, 0.1); },
  power() {
    [400, 600, 800].forEach((f, i) => setTimeout(() => this.beep(f, 'triangle', 0.1, 0.12), i * 50));
  },
  eatGhost() {
    [800, 1100, 1400].forEach((f, i) => setTimeout(() => this.beep(f, 'sine', 0.1, 0.15), i * 40));
  },
  hit() { this.beep(120, 'sawtooth', 0.25, 0.2); },
  level() {
    [520, 650, 780, 1040].forEach((f, i) => setTimeout(() => this.beep(f, 'square', 0.12, 0.1), i * 80));
  }
};

// --- Configurações da Grelha ---
const GRID = 18;
const CELL = 1.0;
const HALF = (GRID * CELL) / 2;

let scene, camera, renderer;
let snake = [];
let foods = [];
let powerPellets = [];
let magnets = [];
let ghosts = [];

let snakeDir = { x: 1, z: 0 };
let nextDir = { x: 1, z: 0 };
let lives = 6;
let score = 0;
let level = 1;
let levelGoal = 15;
let running = false;
let stepTimer = 0;
let stepInterval = 0.16;

let hunterTime = 0;
let magnetTime = 0;

// Elementos HUD
const livesEl = document.getElementById('lives-el');
const levelEl = document.getElementById('level-el');
const scoreEl = document.getElementById('score-el');
const goalEl = document.getElementById('goal-el');
const hunterPill = document.getElementById('hunter-pill');
const hunterTimer = document.getElementById('hunter-timer');
const magnetPill = document.getElementById('magnet-pill');
const magnetTimer = document.getElementById('magnet-timer');
const banner = document.getElementById('banner');

// Materiais Three.js com autoiluminação (Emissive) para visibilidade garantida
const matHead = new THREE.MeshLambertMaterial({ color: 0x00ff88, emissive: 0x00aa33 });
const matBody = new THREE.MeshLambertMaterial({ color: 0x10b981, emissive: 0x059669 });
const matFood = new THREE.MeshLambertMaterial({ color: 0xff3366, emissive: 0xff0044 });
const matPower = new THREE.MeshLambertMaterial({ color: 0xffb800, emissive: 0xffb800 });
const matMagnet = new THREE.MeshLambertMaterial({ color: 0x00f3ff, emissive: 0x00f3ff });

function initThree() {
  const container = document.getElementById('game-canvas-wrap');
  const w = container.clientWidth;
  const h = container.clientHeight;

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x06070d);

  camera = new THREE.PerspectiveCamera(40, w / h, 0.1, 1000);
  adjustCamera();

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(w, h);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  container.appendChild(renderer.domElement);

  const ambLight = new THREE.AmbientLight(0xffffff, 1.2);
  scene.add(ambLight);

  const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
  dirLight.position.set(0, 30, 10);
  scene.add(dirLight);

  buildBoard();
  window.addEventListener('resize', onResize);
}

function adjustCamera() {
  const container = document.getElementById('game-canvas-wrap');
  const w = container.clientWidth;
  const h = container.clientHeight;
  const aspect = w / h;

  const span = GRID * CELL + 2.0;

  let distance;
  if (aspect < 1) {
    const hFovRad = 40 * (Math.PI / 180);
    const vFovRad = 2 * Math.atan(Math.tan(hFovRad / 2) / aspect);
    distance = (span / 2) / Math.tan(vFovRad / 2);
  } else {
    const vFovRad = 40 * (Math.PI / 180);
    distance = (span / 2) / Math.tan(vFovRad / 2);
  }

  camera.position.set(0, distance * 0.98, distance * 0.28);
  camera.lookAt(0, 0, 0);
  camera.aspect = aspect;
  camera.updateProjectionMatrix();
}

function onResize() {
  const container = document.getElementById('game-canvas-wrap');
  adjustCamera();
  renderer.setSize(container.clientWidth, container.clientHeight);
}

function buildBoard() {
  const boardGeo = new THREE.PlaneGeometry(GRID * CELL, GRID * CELL);
  const boardMat = new THREE.MeshStandardMaterial({ color: 0x0c1222, roughness: 0.6 });
  const board = new THREE.Mesh(boardGeo, boardMat);
  board.rotation.x = -Math.PI / 2;
  board.position.y = 0;
  scene.add(board);

  const grid = new THREE.GridHelper(GRID * CELL, GRID, 0x00f3ff, 0x1e293b);
  grid.position.y = 0.02;
  scene.add(grid);

  const borderMat = new THREE.MeshBasicMaterial({ color: 0x8b5cf6 });
  const t = 0.2;
  const l = GRID * CELL + t * 2;

  const top = new THREE.Mesh(new THREE.BoxGeometry(l, t, t), borderMat);
  top.position.set(0, 0.1, -HALF - t / 2);
  const btm = new THREE.Mesh(new THREE.BoxGeometry(l, t, t), borderMat);
  btm.position.set(0, 0.1, HALF + t / 2);
  const left = new THREE.Mesh(new THREE.BoxGeometry(t, t, l), borderMat);
  left.position.set(-HALF - t / 2, 0.1, 0);
  const right = new THREE.Mesh(new THREE.BoxGeometry(t, t, l), borderMat);
  right.position.set(HALF + t / 2, 0.1, 0);

  scene.add(top, btm, left, right);
}

function toWorld(x, z) {
  return {
    x: (x * CELL) - HALF + (CELL / 2),
    z: (z * CELL) - HALF + (CELL / 2)
  };
}

// Criação dos Fantasmas
function createGhost(colorHex) {
  const group = new THREE.Group();
  const mat = new THREE.MeshLambertMaterial({ color: colorHex });

  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.38, 0.38, 0.35, 16), mat);
  body.position.y = 0.25;
  const dome = new THREE.Mesh(new THREE.SphereGeometry(0.38, 16, 12, 0, Math.PI * 2, 0, Math.PI / 2), mat);
  dome.position.y = 0.42;

  const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const pupMat = new THREE.MeshBasicMaterial({ color: 0x0055ff });

  const eL = new THREE.Mesh(new THREE.SphereGeometry(0.09, 8, 8), eyeMat);
  eL.position.set(-0.14, 0.4, 0.32);
  const pL = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 8), pupMat);
  pL.position.set(-0.14, 0.4, 0.39);

  const eR = new THREE.Mesh(new THREE.SphereGeometry(0.09, 8, 8), eyeMat);
  eR.position.set(0.14, 0.4, 0.32);
  const pR = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 8), pupMat);
  pR.position.set(0.14, 0.4, 0.39);

  group.add(body, dome, eL, pL, eR, pR);
  group.userData = { mat, origColor: colorHex };
  return group;
}

function initGame() {
  // Limpeza
  snake.forEach(s => scene.remove(s.mesh));
  snake = [];
  foods.forEach(f => scene.remove(f.mesh));
  foods = [];
  powerPellets.forEach(p => scene.remove(p.mesh));
  powerPellets = [];
  magnets.forEach(m => scene.remove(m.mesh));
  magnets = [];
  ghosts.forEach(g => scene.remove(g.mesh));
  ghosts = [];

  const startX = Math.floor(GRID / 2);
  const startZ = Math.floor(GRID / 2);
  snakeDir = { x: 1, z: 0 };
  nextDir = { x: 1, z: 0 };

  // Construção robusta da cobra: esferas simples elevadas a Y=0.45
  for (let i = 0; i < 4; i++) {
    const isHead = (i === 0);
    const radius = isHead ? 0.48 : 0.40;
    const mesh = new THREE.Mesh(
      new THREE.SphereGeometry(radius, 16, 16),
      isHead ? matHead : matBody
    );

    const pos = toWorld(startX - i, startZ);
    mesh.position.set(pos.x, 0.45, pos.z);
    scene.add(mesh);
    snake.push({ x: startX - i, z: startZ, mesh });
  }

  // Fantasmas nos 4 cantos distantes
  const colors = [0xff3344, 0xff66cc, 0x00f3ff, 0xffa500];
  const spawnPoints = [
    { x: 2, z: 2 },
    { x: GRID - 3, z: 2 },
    { x: 2, z: GRID - 3 },
    { x: GRID - 3, z: GRID - 3 }
  ];

  const totalGhosts = Math.min(2 + (level - 1), 4);
  for (let i = 0; i < totalGhosts; i++) {
    const mesh = createGhost(colors[i]);
    const pos = toWorld(spawnPoints[i].x, spawnPoints[i].z);
    mesh.position.set(pos.x, 0, pos.z);
    scene.add(mesh);
    ghosts.push({
      x: spawnPoints[i].x,
      z: spawnPoints[i].z,
      homeX: spawnPoints[i].x,
      homeZ: spawnPoints[i].z,
      mesh,
      tickCooldown: i % 2
    });
  }

  for (let i = 0; i < 3; i++) spawnFood();
  spawnPowerPellet();
  spawnMagnet();
  updateHUD();
}

function spawnFood() {
  let pos;
  do {
    pos = { x: Math.floor(Math.random() * GRID), z: Math.floor(Math.random() * GRID) };
  } while (snake.some(s => s.x === pos.x && s.z === pos.z));

  const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.32, 12, 12), matFood);
  const w = toWorld(pos.x, pos.z);
  mesh.position.set(w.x, 0.35, w.z);
  scene.add(mesh);
  foods.push({ ...pos, mesh });
}

function spawnPowerPellet() {
  if (powerPellets.length > 0) return;
  const pos = { x: Math.floor(Math.random() * (GRID - 4)) + 2, z: Math.floor(Math.random() * (GRID - 4)) + 2 };
  const mesh = new THREE.Mesh(new THREE.DodecahedronGeometry(0.40), matPower);
  const w = toWorld(pos.x, pos.z);
  mesh.position.set(w.x, 0.4, w.z);
  scene.add(mesh);
  powerPellets.push({ ...pos, mesh });
}

function spawnMagnet() {
  if (magnets.length > 0) return;
  const pos = { x: Math.floor(Math.random() * (GRID - 4)) + 2, z: Math.floor(Math.random() * (GRID - 4)) + 2 };
  const mesh = new THREE.Mesh(new THREE.TorusGeometry(0.32, 0.1, 8, 16, Math.PI), matMagnet);
  mesh.rotation.x = -Math.PI / 2;
  const w = toWorld(pos.x, pos.z);
  mesh.position.set(w.x, 0.35, w.z);
  scene.add(mesh);
  magnets.push({ ...pos, mesh });
}

function gameTick() {
  snakeDir = { ...nextDir };
  const head = snake[0];

  // Atravessar paredes (wrap-around)
  let nx = (head.x + snakeDir.x + GRID) % GRID;
  let nz = (head.z + snakeDir.z + GRID) % GRID;

  // Colisão com o corpo
  for (let i = 1; i < snake.length; i++) {
    if (snake[i].x === nx && snake[i].z === nz) {
      takeDamage();
      return;
    }
  }

  // Interação com fantasmas
  for (let g of ghosts) {
    if (g.x === nx && g.z === nz) {
      if (hunterTime > 0) {
        AudioFx.eatGhost();
        score += 50;
        g.x = g.homeX;
        g.z = g.homeZ;
        const w = toWorld(g.x, g.z);
        g.mesh.position.set(w.x, 0, w.z);
      } else {
        takeDamage();
        return;
      }
    }
  }

  let ate = false;

  // Comida
  for (let i = foods.length - 1; i >= 0; i--) {
    if (foods[i].x === nx && foods[i].z === nz) {
      scene.remove(foods[i].mesh);
      foods.splice(i, 1);
      score++;
      ate = true;
      AudioFx.eat();
      spawnFood();
      checkLevel();
      break;
    }
  }

  // Pílula ⚡
  for (let i = powerPellets.length - 1; i >= 0; i--) {
    if (powerPellets[i].x === nx && powerPellets[i].z === nz) {
      scene.remove(powerPellets[i].mesh);
      powerPellets.splice(i, 1);
      hunterTime = 10;
      score += 5;
      AudioFx.power();
      setTimeout(spawnPowerPellet, 16000);
      break;
    }
  }

  // Ímã 🧲
  for (let i = magnets.length - 1; i >= 0; i--) {
    if (magnets[i].x === nx && magnets[i].z === nz) {
      scene.remove(magnets[i].mesh);
      magnets.splice(i, 1);
      magnetTime = 8;
      AudioFx.power();
      setTimeout(spawnMagnet, 20000);
      break;
    }
  }

  // Se não comeu, move a cauda para a frente
  if (!ate) {
    const tail = snake.pop();
    const w = toWorld(nx, nz);
    tail.x = nx;
    tail.z = nz;
    tail.mesh.position.set(w.x, 0.45, w.z);
    tail.mesh.material = matHead;
    tail.mesh.scale.set(1.0, 1.0, 1.0);

    if (snake.length > 0) {
      snake[0].mesh.material = matBody;
      snake[0].mesh.scale.set(0.85, 0.85, 0.85);
    }
    snake.unshift(tail);
  } else {
    // Cresce um segmento novo
    const newMesh = new THREE.Mesh(new THREE.SphereGeometry(0.48, 16, 16), matHead);
    const w = toWorld(nx, nz);
    newMesh.position.set(w.x, 0.45, w.z);
    scene.add(newMesh);

    if (snake.length > 0) {
      snake[0].mesh.material = matBody;
      snake[0].mesh.scale.set(0.85, 0.85, 0.85);
    }
    snake.unshift({ x: nx, z: nz, mesh: newMesh });
  }

  updateGhosts();
  updateHUD();
}

function updateGhosts() {
  const head = snake[0];

  ghosts.forEach((g, idx) => {
    g.tickCooldown++;
    const stepFreq = hunterTime > 0 ? 2 : 1;
    if (g.tickCooldown < stepFreq) return;
    g.tickCooldown = 0;

    let targetX = head.x;
    let targetZ = head.z;

    if (hunterTime > 0) {
      targetX = g.x > head.x ? GRID - 1 : 0;
      targetZ = g.z > head.z ? GRID - 1 : 0;
    } else {
      if (idx === 1) targetX = (head.x + 2) % GRID;
      if (idx === 2) targetZ = (head.z + 2) % GRID;
    }

    const options = [
      { x: (g.x + 1) % GRID, z: g.z },
      { x: (g.x - 1 + GRID) % GRID, z: g.z },
      { x: g.x, z: (g.z + 1) % GRID },
      { x: g.x, z: (g.z - 1 + GRID) % GRID }
    ];

    options.sort((a, b) => Math.hypot(a.x - targetX, a.z - targetZ) - Math.hypot(b.x - targetX, b.z - targetZ));

    let chosen = options[0];
    for (let opt of options) {
      if (!ghosts.some(other => other !== g && other.x === opt.x && other.z === opt.z)) {
        chosen = opt;
        break;
      }
    }

    g.x = chosen.x;
    g.z = chosen.z;
    const pos = toWorld(g.x, g.z);
    g.mesh.position.set(pos.x, 0, pos.z);

    if (g.x === head.x && g.z === head.z) {
      if (hunterTime > 0) {
        AudioFx.eatGhost();
        score += 50;
        g.x = g.homeX;
        g.z = g.homeZ;
      } else {
        takeDamage();
      }
    }
  });
}

function updateMagnet(delta) {
  if (magnetTime <= 0) return;
  const headW = toWorld(snake[0].x, snake[0].z);

  foods.forEach(f => {
    f.mesh.position.x += (headW.x - f.mesh.position.x) * delta * 6.0;
    f.mesh.position.z += (headW.z - f.mesh.position.z) * delta * 6.0;

    if (Math.hypot(f.mesh.position.x - headW.x, f.mesh.position.z - headW.z) < 0.5) {
      score++;
      AudioFx.eat();
      scene.remove(f.mesh);
      foods = foods.filter(item => item !== f);
      spawnFood();
      checkLevel();
    }
  });
}

function takeDamage() {
  lives--;
  AudioFx.hit();
  if (lives <= 0) {
    gameOver();
  } else {
    const startX = Math.floor(GRID / 2);
    const startZ = Math.floor(GRID / 2);
    snakeDir = { x: 1, z: 0 };
    nextDir = { x: 1, z: 0 };

    snake.forEach((s, i) => {
      s.x = (startX - i + GRID) % GRID;
      s.z = startZ;
      const w = toWorld(s.x, s.z);
      s.mesh.position.set(w.x, 0.45, w.z);
    });
    updateHUD();
  }
}

function checkLevel() {
  if (score >= levelGoal) {
    level++;
    levelGoal += 15 + level * 5;
    score += 100;
    stepInterval = Math.max(0.09, stepInterval - 0.012);
    AudioFx.level();

    banner.textContent = `FASE ${level}!`;
    banner.classList.add('active');
    setTimeout(() => banner.classList.remove('active'), 1800);

    if (ghosts.length < 4) {
      const colors = [0xff3344, 0xff66cc, 0x00f3ff, 0xffa500];
      const spawnPoints = [
        { x: 2, z: 2 },
        { x: GRID - 3, z: 2 },
        { x: 2, z: GRID - 3 },
        { x: GRID - 3, z: GRID - 3 }
      ];
      const idx = ghosts.length;
      const mesh = createGhost(colors[idx]);
      scene.add(mesh);
      ghosts.push({
        x: spawnPoints[idx].x,
        z: spawnPoints[idx].z,
        homeX: spawnPoints[idx].x,
        homeZ: spawnPoints[idx].z,
        mesh,
        tickCooldown: idx % 2
      });
    }
  }
}

function updateHUD() {
  livesEl.textContent = '❤️'.repeat(Math.max(0, lives));
  levelEl.textContent = String(level).padStart(2, '0');
  scoreEl.textContent = score;
  goalEl.textContent = levelGoal;

  if (hunterTime > 0) {
    hunterPill.classList.add('active-hunter');
    hunterTimer.textContent = `${Math.ceil(hunterTime)}s`;
  } else {
    hunterPill.classList.remove('active-hunter');
    hunterTimer.textContent = 'OFF';
  }

  if (magnetTime > 0) {
    magnetPill.classList.add('active-magnet');
    magnetTimer.textContent = `${Math.ceil(magnetTime)}s`;
  } else {
    magnetPill.classList.remove('active-magnet');
    magnetTimer.textContent = 'OFF';
  }

  ghosts.forEach(g => {
    if (hunterTime > 0) {
      const flash = hunterTime < 3 && Math.floor(hunterTime * 6) % 2 === 0;
      g.mesh.userData.mat.color.setHex(flash ? 0xffffff : 0x0077ff);
    } else {
      g.mesh.userData.mat.color.setHex(g.mesh.userData.origColor);
    }
  });
}

// Ciclo de Renderização Three.js
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);

  const delta = clock.getDelta();
  const time = clock.getElapsedTime();

  if (running) {
    stepTimer += delta;
    if (stepTimer >= stepInterval) {
      stepTimer = 0;
      gameTick();
    }

    if (hunterTime > 0) hunterTime = Math.max(0, hunterTime - delta);
    if (magnetTime > 0) {
      magnetTime = Math.max(0, magnetTime - delta);
      updateMagnet(delta);
    }
  }

  foods.forEach((f, i) => {
    f.mesh.position.y = 0.35 + Math.sin(time * 4 + i) * 0.05;
  });
  powerPellets.forEach(p => {
    p.mesh.rotation.y += delta * 2;
    p.mesh.rotation.x += delta * 1.5;
  });
  magnets.forEach(m => {
    m.mesh.rotation.z += delta * 3;
  });

  renderer.render(scene, camera);
}

function setupControls() {
  const setDir = (x, z) => {
    if (x !== 0 && snakeDir.x === -x) return;
    if (z !== 0 && snakeDir.z === -z) return;
    nextDir = { x, z };
  };

  window.addEventListener('keydown', e => {
    if (!running) return;
    switch (e.key) {
      case 'ArrowUp': case 'w': case 'W': setDir(0, -1); break;
      case 'ArrowDown': case 's': case 'S': setDir(0, 1); break;
      case 'ArrowLeft': case 'a': case 'A': setDir(-1, 0); break;
      case 'ArrowRight': case 'd': case 'D': setDir(1, 0); break;
    }
  });

  const bind = (id, x, z) => {
    const el = document.getElementById(id);
    const trigger = (e) => {
      e.preventDefault();
      setDir(x, z);
    };
    el.addEventListener('touchstart', trigger, { passive: false });
    el.addEventListener('mousedown', trigger);
  };

  bind('b-up', 0, -1);
  bind('b-down', 0, 1);
  bind('b-left', -1, 0);
  bind('b-right', 1, 0);

  // Gesto Swipe
  let sx = 0, sy = 0;
  window.addEventListener('touchstart', e => {
    sx = e.touches[0].clientX;
    sy = e.touches[0].clientY;
  }, { passive: true });

  window.addEventListener('touchend', e => {
    if (!running) return;
    const dx = e.changedTouches[0].clientX - sx;
    const dy = e.changedTouches[0].clientY - sy;
    if (Math.hypot(dx, dy) > 20) {
      if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
      else setDir(0, dy > 0 ? 1 : -1);
    }
  }, { passive: true });
}

function startGame() {
  AudioFx.init();
  document.getElementById('start-modal').classList.add('hidden');
  lives = 6;
  score = 0;
  level = 1;
  levelGoal = 15;
  stepInterval = 0.16;
  initGame();
  running = true;
}

function restartGame() {
  document.getElementById('over-modal').classList.add('hidden');
  startGame();
}

function gameOver() {
  running = false;
  document.getElementById('final-score').textContent = score;
  document.getElementById('final-level').textContent = String(level).padStart(2, '0');
  document.getElementById('over-modal').classList.remove('hidden');
}

initThree();
setupControls();
animate();
</script>
